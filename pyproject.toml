[project]
name = "follow-the-shade-agent"
version = "0.1.0"
description = "FastAPI backend agent for Follow the Shade."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.128.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
