[project]
name = "follow-the-shade-agent"
version = "0.1.0"
description = "FastAPI backend agent for Follow the Shade."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "astral>=3.2",
    "fastapi>=0.128.5",
    "httpx>=0.28.1",
    "langchain>=1.2.9",
    "langchain-openai>=1.1.9",
    "langgraph>=1.0.0",
    "pyjwt[crypto]>=2.10.0",
    "pydantic-settings>=2.12.0",
    "pyproj>=3.7.0",
    "pyyaml>=6.0.3",
    "shapely>=2.0.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
